<!DOCTYPE html>
<html lang="en-gb">

<head>
    <meta charset="UTF-8">
    <title>Guardian API</title>
    <!-- Added link to the jQuery Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <!-- Added a link to Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <!-- Font Awesome CSS Icons (For cool glyphicons) -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" />
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
</head>

<body>
    <div class="container">
        <!-- Jumbotron for Title -->
        <div class="p-5 mb-4 bg-body-tertiary rounded-3">
            <div class="container-fluid py-5">
              <h1 class="display-5 text-center">Guardian API Search</h1>
            </div>
          </div>
            <div class="search-container">
                <div class="card">
                    <div class="card-header text-light bg-dark">
                        <i class="fa fa-search" aria-hidden="true"></i> Search Parameters</div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <div class="row">
                                    <br>
                                    <label for="search-string" class="form-label">Search Term:</label>
                                    <div class="input-group mb-3">
                                        <input type="text" class="form-control" aria-describedby="sizing-addon2" id="search-string" placeholder="e.g. tech">
                                    </div>
                                </div>
                                <br>
                                <div class="d-flex flex-row justify-content-between">
                                    <div>
                                        <button type="button" class="btn btn-outline-secondary search">
                                            <i class="fa fa-search" aria-hidden="true"></i> Search
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary clear">
                                            <i class="fa fa-trash" aria-hidden="true"></i> Clear Results
                                        </button>
                                    </div>
                                    <button type="button" id="filter-btn" class="btn btn-outline-secondary clear">
                                        <i class="fa fa-bars" aria-hidden="true"></i> Filters
                                    </button>
                                </div>
                                <br>
                                <br>
                                <div id="filters">
                                    <p>Filters <span>(optional)</span> :</p>
                                    <div class="mb-2">
                                        <label for="date-from">Date From:</label>
                                        <input type="date" id="date-from" class="input-group-text mb-2" name="date-from">
                                    </div>
                                    <div class="mb-2">
                                        <label for="date-to">Date To:</label>
                                        <input type="date" id="date-to" class="input-group-text mb-2" name="date-to">
                                    </div>
                                    <div class="mb-2">
                                        <label for="page-size">Page Size:</label>
                                        <input type="number" id="page-size" class="input-group-text mb-2" name="page-size" min="1" max="50" placeholder="10">
                                    </div>
                                    <div>
                                        <label for="rating" class="me-1">Rating:</label>
                                        <input type="checkbox" id="rating-check" name="rating-check" >
                                        <span class="me-1">Enable</span>
                                        <input type="range" id="rating" class="form-range range-thumb me-2" name="rating" min="1" max="5" step="0.1" disabled>
                                        <input type="number" id="rating-output" class="input-group-text mb-2" name="rating-output" min="1" max="50" disabled>
                                        <!-- <div class="d-flex flex-row align-content-center justify-content-center">
                                        </div> -->
                                    </div>
                                    <br>
                                    <br>
                                </div>
                                <div class="row">
                                    <label for="aws-api" class="form-label">Input AWS API ID:</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" aria-describedby="sizing-addon2" id="aws-api" placeholder="e.g. 4c1d1ea1db">
                                    </div>
                                </div>
                            </div>    
                        </form>
                    </div>
                </div>
            </div>
            <div class="articles-container">
                <div class="card">
                    <div class="card-header text-light bg-dark">
                        <div><i class="fa fa-th" aria-hidden="true"></i> Top Articles</div>
                        <button id="sqs" class="btn btn-outline-secondary">send to SQS</button>
                    </div>
                    <div class="card-body" id="article-results">
                    </div>
                </div>
            </div>
        <script type="text/javascript" src="assets/javascript/app.js"></script>
</body>

</html>
