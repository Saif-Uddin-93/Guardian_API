<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian API</title>
    <link rel="stylesheet" href="./src/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous" defer></script>
    <script src="./src/script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Guardian API</h1>
        <form id="search-form">
            <label for="search-term">Enter Search Term:</label>
            <input type="text" id="search-term" name="search-term" required>
            <div class="filters">
                <h2>Filters <span>(optional)</span></h2>
                <div>
                    <label for="date-from">Date From:</label>
                    <input type="date" id="date-from" name="date-from">
                </div>
                <div>
                    <label for="date-to">Date To:</label>
                    <input type="date" id="date-to" name="date-to">
                </div>
                <div>
                    <label for="page-size">Page Size:</label>
                    <input type="number" id="page-size" name="page-size" min="1" max="50" placeholder="10">
                </div>
                <div>
                    <label for="rating">Rating:</label>
                    <input type="checkbox" id="rating-check" name="rating-check" >
                    <span>Enable</span>
                    <input type="range" id="rating" name="page-size" min="1" max="5" step="1" disabled>
                </div>
                <div>
                    <label for="aws-api">Enter AWS API URI here:</label>
                    <input type="text" name="aws-api" id="aws-api" required>
                </div>
            </div>
            <button type="submit" id="search-button" class="mb-5vh">Search</button>
        </form>
        <section id="results" class="mb-5vh">
            <h2>Results</h2>
            <div id="results-list" class="mb-5vh">
                 <ul>
                    <li>example result</li>
                 </ul>
            </div>
            <button type="button" id="load-more">Load More</button>
        </section>
    </div>
</body>
</html>
